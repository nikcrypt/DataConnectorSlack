# Phase 2 platform skeleton (Kafka + Postgres + MinIO).
# From repo root or this folder:
#   docker compose -f phase2/docker-compose.yml up --build
# Does not replace the Phase 1 root docker-compose.yml used by QA.

name: connector-phase2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: connector
      POSTGRES_PASSWORD: connector
      POSTGRES_DB: connector_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_extraction_platform.sql:/docker-entrypoint-initdb.d/001_extraction_platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector -d connector_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: bitnami/kafka:3.8
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic extract.commands --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic extract.events --partitions 6 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic extract.dlq --partitions 3 --replication-factor 1
        echo "topics ready"
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 minioadmin minioadmin && break
          sleep 1
        done
        mc mb --ignore-existing local/extracts
        echo "bucket ready"
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: phase2/Dockerfile
    command: ["node", "src/api/server.js"]
    environment: &app-env
      DATABASE_URL: postgresql://connector:connector@postgres:5432/connector_platform
      KAFKA_BROKERS: kafka:9092
      KAFKA_COMMANDS_TOPIC: extract.commands
      KAFKA_EVENTS_TOPIC: extract.events
      KAFKA_DLQ_TOPIC: extract.dlq
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: extracts
      API_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  status-writer:
    build:
      context: ..
      dockerfile: phase2/Dockerfile
    command: ["node", "src/status-writer/index.js"]
    environment:
      <<: *app-env
      KAFKA_CLIENT_ID: status-writer
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  connector-slack:
    build:
      context: ..
      dockerfile: phase2/Dockerfile
    command: ["node", "src/worker/index.js"]
    environment:
      <<: *app-env
      CONNECTOR_KEY: slack
      WORKER_MODE: stub
      WORKER_ID: connector-slack-1
      KAFKA_CLIENT_ID: worker-slack
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      status-writer:
        condition: service_started

volumes:
  pgdata:
  miniodata:
